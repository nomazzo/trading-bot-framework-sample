[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-framework-sample"
version = "0.1.0"
description = "Trading bot framework sample with mock broker and paper execution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trading-bot-sample = "trading_bot_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
